mixed-port: 7890
allow-lan: true
bind-address: 100.x.y.z   # Set to the VPS's Tailscale IP
mode: rule
log-level: info
ipv6: true
geodata-mode: true
geo-auto-update: false  # Upload manually
geox-url:
  geoip: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip-lite.dat"
  geosite: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
  mmdb: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country-lite.mmdb"

profile:
  store-selected: true
  store-fake-ip: true

external-controller: 100.x.y.z:9090   # Set to the VPS's Tailscale IP; use a firewall to allow tailscale0 only
secret: "CHANGE-ME-long-random-string"  # Required when not listening on localhost only
external-ui: ui                          # mihomo extracts the dashboard into this directory
external-ui-url: "https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip"

tun:
  enable: true
  stack: mixed
  device: mihomo
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  strict-route: false

  # Key: only route the fake-ip subnet into the Mihomo TUN
  route-address:
    - 198.18.0.0/15

dns:
  enable: true

  # Listen on all addresses, then use a firewall to restrict access to tailscale0 only
  listen: 0.0.0.0:53

  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/15

  # Key: use rule mode to decide which domains return fake-ip vs real-ip
  fake-ip-filter-mode: rule
  fake-ip-filter:
    # Do not fake Tailscale / intranet / local domains
    - DOMAIN-SUFFIX,ts.net,real-ip
    - DOMAIN-SUFFIX,lan,real-ip
    - DOMAIN-SUFFIX,local,real-ip
    - GEOSITE,private,real-ip

    # China domains return real IPs so clients connect directly
    - GEOSITE,cn,real-ip

    # Other domains return fake IPs, entering Tailscale via 198.18.0.0/15 → Japan VPS
    - MATCH,fake-ip

  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114

  nameserver-policy:
    "geosite:cn":
      - https://223.5.5.5/dns-query
      - https://doh.pub/dns-query
    "+.ts.net":
      - 100.100.100.100
    "*.ts.net":
      - 100.100.100.100

  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query

# For JMS, its default server is plain TCP without tls
proxies:
  - name: "vmess-main"
    type: vmess
    server:
    port: 13601
    uuid:
    alterId: 0
    cipher: auto
    udp: false
    tls: false
    servername: jms

  # Self-hosted VMess exit: VMess over WebSocket, TLS terminated by Caddy on :443.
  # Fill in the blanks on your deployed copy (do not commit real values to this public repo).
  # uuid/path must match server-config.yaml and Caddyfile on the overseas VPS.
  - name: "vmess-selfhost"
    type: vmess
    server:                 # your overseas VPS domain, e.g. your.domain.com
    port: 443
    uuid:
    alterId: 0
    cipher: auto
    udp: true               # relay UDP (QUIC/DNS/etc.); tunneled inside the WS/TLS stream
    packet-encoding: xudp   # full-cone NAT; both ends are mihomo so xudp is supported
    tls: true
    servername:             # same domain as `server`
    network: ws
    ws-opts:
      path:                 # a secret path, e.g. /f3a9c1e0d7b2 ; same path as server ws-path + Caddy
      headers:
        Host:               # same domain as `server`

proxy-groups:
  # Pick this group on the dashboard's Proxies page to switch upstreams (store-selected remembers the choice).
  # vmess-main = JMS, vmess-selfhost = your own exit.
  - name: PROXY
    type: select
    proxies:
      - vmess-main
      - vmess-selfhost
      - DIRECT

rules:
  # Tailscale / intranet
  - DOMAIN-SUFFIX,ts.net,DIRECT
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT,no-resolve

  # China sites: if they reach Mihomo by mistake, still go DIRECT from the Japan server;
  # normally they already resolve to real-ip at the DNS stage, so clients connect directly.
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT,no-resolve

  # All other fake-ip traffic goes through the proxy
  - MATCH,PROXY
